name = "identity-dynamic"
account_id = "dc3edd1f2c8c99741cb96b2e00e3f122"
workers_dev = false
compatibility_date = "2024-11-25"
main = "src/main.js"


routes = [
	{ pattern = "", custom_domain = true }	
]

# wrangler kv:namespace create IDENTITY_DYNAMIC_THEME_STORE

[[kv_namespaces]] 
binding = "IDENTITY_DYNAMIC_THEME_STORE"
id = "050bad61c6f44fbfabd3d519bc9cd64a" # unique ID of the previously created namespace

[vars]
# - BEARER_TOKEN (Defined with wrangler secret put)
CORS_ORIGIN = "https://clouddedicated.info/debug" # This should be the route pattern domain /debug (https://example.com/debug)
ACCOUNT_ID = "dc3edd1f2c8c99741cb96b2e00e3f122"
ORGANIZATION_ID = ""
ORGANIZATION_NAME = "sweb"
DEBUG = "true"
TARGET_GROUP = "" # Define the "special group" that you want to use for notification

[site]
bucket = "./build" 

[build]
command = "npm run build"
